<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Canvas 仅刀柄挥砍（以右上角为中心）</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0f1015;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            color: #fff;
            font-family: sans-serif;
        }
        canvas {
            background-color: #1a1b26;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            border-radius: 8px;
            cursor: crosshair;
        }
    </style>
</head>
<body>

    <canvas id="swordCanvas" width="600" height="600"></canvas>

<script>
const canvas = document.getElementById('swordCanvas');
const ctx = canvas.getContext('2d');

// --- 1. 图片资源加载 ---
const imgDao = new Image();
imgDao.src = 'dao.png'; // 刀身图片（静止）
const imgDaobing = new Image();
imgDaobing.src = 'daobing.png'; // 刀柄图片（参与挥砍旋转）

let useFallback = false; 

function checkImages() {
    if (!imgDao.complete || imgDao.naturalWidth === 0 || !imgDaobing.complete || imgDaobing.naturalWidth === 0) {
        useFallback = true;
    }
    draw();
}

imgDao.onload = imgDaobing.onload = draw;
imgDao.onerror = imgDaobing.onerror = () => {
    useFallback = true;
    draw();
};

// --- 2. 核心物理与动画变量 ---
const pivot = { x: 300, y: 300 }; // 旋转中心点（这也是刀柄右上角定位的核心点）
const initAngle = 0;    // 初始位置

let currentAngle = initAngle;
let isAnimating = false;
let animStartTime = 0;
const duration = 250;             // 挥砍速度（毫秒）

let startAngle = initAngle;
let targetAngle = initAngle;
let trailStartAngle = initAngle;  

// --- 3. 鼠标点击事件监听（逆时针算法） ---
canvas.addEventListener('mousedown', (e) => {
    if (isAnimating) return; 

    const rect = canvas.getBoundingClientRect();
    const mouseX = e.clientX - rect.left;
    const mouseY = e.clientY - rect.top;

    const clickAngle = Math.atan2(mouseY - pivot.y, mouseX - pivot.x);

    // 确保无论点击哪里，都逆时针（角度减小）砍回初始朝上的位置
    let diff = (clickAngle - initAngle) % (2 * Math.PI);
    if (diff < 0) diff += 2 * Math.PI;

    startAngle = clickAngle;
    targetAngle = clickAngle - diff;
    trailStartAngle = clickAngle; 

    isAnimating = true;
    animStartTime = performance.now();
    requestAnimationFrame(animate);
});

// --- 4. 动画循环 ---
function animate(timestamp) {
    if (!isAnimating) return;

    const elapsed = timestamp - animStartTime;
    const progress = Math.min(elapsed / duration, 1);

    // easeOutCubic 缓动
    const ease = 1 - Math.pow(1 - progress, 3);
    currentAngle = startAngle + (targetAngle - startAngle) * ease;

    draw();

    if (progress < 1) {
        requestAnimationFrame(animate);
    } else {
        isAnimating = false;
        currentAngle = initAngle; // 动画结束后刀柄复位
        draw();
    }
}

// --- 5. 渲染函数 ---
function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // 绘制提示文字
    ctx.fillStyle = '#a9b1d6';
    ctx.font = '16px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('点击任意位置：刀柄以「右上角」为中心逆时针挥砍', canvas.width / 2, 50);

    // ==========================================
    // 步骤 A: 绘制静止不动的 刀身 (dao.png)
    // ==========================================
    if (!useFallback) {
        const daoW = imgDao.width;
        const daoH = imgDao.height;
        ctx.save();
        ctx.translate(pivot.x, pivot.y);
        ctx.drawImage(imgDao, -daoW / 2, -daoH, daoW, daoH);
        ctx.restore();
    } else {
        // 备用矢量刀身（静止）
        ctx.save();
        ctx.translate(pivot.x, pivot.y);
        ctx.fillStyle = '#c0caf5';
        ctx.beginPath();
        ctx.moveTo(-6, -6);
        ctx.lineTo(-6, -140);
        ctx.quadraticCurveTo(-6, -165, 4, -160);
        ctx.lineTo(6, -6);
        ctx.closePath();
        ctx.fill();
        ctx.restore();
    }

    // ==========================================
    // 步骤 B: 绘制挥砍蓝色刀光
    // ==========================================
    if (isAnimating) {
        ctx.save();
        ctx.strokeStyle = 'rgba(0, 220, 255, 0.5)';
        ctx.lineWidth = 10;
        ctx.lineCap = 'round';
        ctx.shadowBlur = 15;
        ctx.shadowColor = '#00f0ff';

        ctx.beginPath();
        // 刀光半径设为 100 像素，完美匹配刀柄旋转扫过的弧度
        ctx.arc(pivot.x, pivot.y, 100, trailStartAngle, currentAngle, true);
        ctx.stroke();
        ctx.restore();
    }

    // ==========================================
    // 步骤 C: 绘制运动旋转的 刀柄 (daobing.png)
    // ==========================================
    ctx.save();
    ctx.translate(pivot.x, pivot.y); // 将画布原点移到旋转中心
    ctx.rotate(currentAngle);        // 绕该点进行旋转

    if (!useFallback) {
        const bingW = 55;   // 刀柄宽度
        const bingH = 100;  // 刀柄高度
        
        // 【核心修改】：通过将 X 偏移量设为 -bingW，Y 偏移量设为 0
        // 使图片的右上角（即图片内部坐标 [bingW, 0]）与画布旋转中心 [0, 0] 重合。
        ctx.drawImage(imgDaobing, -50, -90, bingW, bingH);
    } else {
        // 备用矢量刀柄（动态旋转，右上角对准旋转中心）
        ctx.fillStyle = '#3a2010'; 
        ctx.fillRect(-20, 0, 20, 80);
        ctx.fillStyle = '#e0af68'; 
        ctx.fillRect(-35, 0, 35, 12);
    }

    ctx.restore();
}

// 延迟检查图片是否成功加载
setTimeout(checkImages, 100);
</script>

</body>
</html>
