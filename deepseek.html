    <div class="ds-toast" id="dsToast"></div>

    <script>
    (function () {
        'use strict';

        // ── DOM refs ──
        const dsMessages = document.getElementById('dsMessages');
        const dsEmpty = document.getElementById('dsEmpty');
        const dsInput = document.getElementById('dsInput');
        const dsSendBtn = document.getElementById('dsSendBtn');
        const dsReasonBtn = document.getElementById('dsReasonBtn');
        const dsApiKey = document.getElementById('dsApiKey');
        const dsModel = document.getElementById('dsModel');
        const dsToast = document.getElementById('dsToast');
        const dsUploadBtn = document.getElementById('dsUploadBtn');
        const dsFileInput = document.getElementById('dsFileInput');
        const dsAttachArea = document.getElementById('dsAttachArea');

        // Theme
        const themeKey = 'json-tool-theme';
        const savedTheme = localStorage.getItem(themeKey);
        if (savedTheme) document.documentElement.setAttribute('data-theme', savedTheme);
        document.getElementById('themeToggle').addEventListener('click', () => {
            const cur = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', cur);
            localStorage.setItem(themeKey, cur);
        });

        // Toast
        function showToast(msg, type) {
            dsToast.textContent = msg;
            dsToast.className = 'ds-toast ' + (type || '');
            requestAnimationFrame(() => dsToast.classList.add('show'));
            clearTimeout(showToast._t);
            showToast._t = setTimeout(() => dsToast.classList.remove('show'), 3000);
        }

        // API Key persistence
        const apiKeyKey = 'ds-api-key';
        const savedKey = localStorage.getItem(apiKeyKey);
        if (savedKey) dsApiKey.value = savedKey;
        dsApiKey.addEventListener('change', () => {
            localStorage.setItem(apiKeyKey, dsApiKey.value.trim());
        });

        let messages = [];
        let isReasoning = false;
        let isSending = false;
        let attachments = []; // { name, type, data (base64), isImage }

        // Reasoning toggle
        dsReasonBtn.addEventListener('click', () => {
            isReasoning = !isReasoning;
            dsReasonBtn.classList.toggle('active', isReasoning);
            if (isReasoning) {
                dsModel.value = 'deepseek-v4-pro';
            } else if (dsModel.value === 'deepseek-v4-pro') {
                dsModel.value = 'deepseek-v4-flash';
            }
        });
        dsModel.addEventListener('change', () => {
            if (dsModel.value === 'deepseek-v4-pro') {
                isReasoning = true;
                dsReasonBtn.classList.add('active');
            } else {
                isReasoning = false;
                dsReasonBtn.classList.remove('active');
            }
        });

        // File upload
        dsUploadBtn.addEventListener('click', () => dsFileInput.click());
        dsFileInput.addEventListener('change', () => {
            for (const file of dsFileInput.files) {
                if (attachments.length >= 5) {
                    showToast('最多上传 5 个附件', 'warning');
                    break;
                }
                const isImage = file.type.startsWith('image/');
                const reader = new FileReader();
                reader.onload = (e) => {
                    attachments.push({
                        name: file.name,
                        type: file.type,
                        data: e.target.result,
                        isImage: isImage
                    });
                    renderAttachments();
                };
                reader.readAsDataURL(file);
            }
            dsFileInput.value = '';
        });

        function renderAttachments() {
            dsAttachArea.innerHTML = '';
            attachments.forEach((att, i) => {
                const div = document.createElement('div');
                div.className = 'ds-attach-item';
                if (att.isImage) {
                    div.innerHTML = '<img src="' + att.data + '" alt="preview" /><span class="ds-attach-name">' + escapeHTML(att.name) + '</span>';
                } else {
                    div.innerHTML = '<span class="ds-attach-name">📄 ' + escapeHTML(att.name) + '</span>';
                }
                const removeBtn = document.createElement('button');
                removeBtn.className = 'ds-attach-remove';
                removeBtn.textContent = '×';
                removeBtn.addEventListener('click', () => {
                    attachments.splice(i, 1);
                    renderAttachments();
                });
                div.appendChild(removeBtn);
                dsAttachArea.appendChild(div);
            });
        }

        // Drag & drop
        dsInput.addEventListener('dragover', (e) => {
            e.preventDefault();
            e.stopPropagation();
        });
        dsInput.addEventListener('drop', (e) => {
            e.preventDefault();
            e.stopPropagation();
            for (const file of e.dataTransfer.files) {
                if (attachments.length >= 5) {
                    showToast('最多上传 5 个附件', 'warning');
                    break;
                }
                const isImage = file.type.startsWith('image/');
                const reader = new FileReader();
                reader.onload = (ev) => {
                    attachments.push({
                        name: file.name,
                        type: file.type,
                        data: ev.target.result,
                        isImage: isImage
                    });
                    renderAttachments();
                };
                reader.readAsDataURL(file);
            }
        });

        // Clear
        document.getElementById('clearBtn').addEventListener('click', () => {
            messages = [];
            attachments = [];
            renderAttachments();
            dsMessages.innerHTML = '';
            dsMessages.appendChild(dsEmpty);
            dsEmpty.style.display = '';
        });

        function escapeHTML(s) {
            return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        }

        function appendMsg(role, content, thinking, attachList) {
            if (dsEmpty.style.display !== 'none') dsEmpty.style.display = 'none';

            const div = document.createElement('div');
            div.className = 'ds-msg ' + role;
            const roleLabel = role === 'user' ? '你' : 'DeepSeek';
            let html = '<div class="ds-msg-role">' + escapeHTML(roleLabel) + '</div><div class="ds-msg-content">';
            if (thinking) {
                html += '<div class="ds-thinking">🤔 思考中…<br/>' + escapeHTML(thinking).replace(/\n/g, '<br>') + '</div>';
            }
            if (attachList && attachList.length) {
                html += '<div class="ds-msg-attach">';
                for (const att of attachList) {
                    if (att.isImage) {
                        html += '<img src="' + att.data + '" alt="' + escapeHTML(att.name) + '" onclick="window.open(this.src)" />';
                    } else {
                        html += '<span class="ds-msg-attach-file">📄 ' + escapeHTML(att.name) + '</span>';
                    }
                }
                html += '</div>';
            }
            if (role === 'assistant') {
                html += marked.parse(content || '');
            } else {
                html += escapeHTML(content).replace(/\n/g, '<br>');
            }
            html += '</div>';
            div.innerHTML = html;
            dsMessages.appendChild(div);
            dsMessages.scrollTop = dsMessages.scrollHeight;
            return div;
        }

        function showLoading() {
            const div = document.createElement('div');
            div.className = 'ds-loading';
            div.id = 'dsLoading';
            div.textContent = 'DeepSeek 正在思考…';
            dsMessages.appendChild(div);
            dsMessages.scrollTop = dsMessages.scrollHeight;
        }

        function removeLoading() {
            const el = document.getElementById('dsLoading');
            if (el) el.remove();
        }

        async function send() {
            const text = dsInput.value.trim();
            if ((!text && !attachments.length) || isSending) return;
            const apiKey = dsApiKey.value.trim();
            if (!apiKey) {
                showToast('请先填写 DeepSeek API Key', 'warning');
                dsApiKey.focus();
                return;
            }

            isSending = true;
            dsSendBtn.disabled = true;
            dsInput.value = '';
            dsInput.style.height = 'auto';

            const currentAttachments = [...attachments];
            attachments = [];
            renderAttachments();

            let msgContent;
            if (currentAttachments.length > 0) {
                const parts = [];
                if (text) parts.push({ type: 'text', text: text });
                for (const att of currentAttachments) {
                    if (att.isImage) {
                        parts.push({ type: 'image', image: att.data });
                    } else {
                        const base64Data = att.data.split(',')[1];
                        let fileContent;
                        try {
                            fileContent = atob(base64Data);
                        } catch (_) {
                            fileContent = '[binary file]';
                        }
                        parts.push({ type: 'text', text: '📎 文件 ' + att.name + ' 的内容：\n' + fileContent });
                    }
                }
                msgContent = parts;
            } else {
                msgContent = text;
            }

            messages.push({ role: 'user', content: msgContent });
            appendMsg('user', text || '(附件)', null, currentAttachments);
            showLoading();

            const model = dsModel.value;
            try {
                const res = await fetch('https://api.deepseek.com/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer ' + apiKey
                    },
                    body: JSON.stringify({
                        model: model,
                        messages: messages,
                        stream: true
                    })
                });

                if (!res.ok) {
                    const err = await res.json().catch(() => ({}));
                    throw new Error(err.error?.message || 'HTTP ' + res.status);
                }

                const reader = res.body.getReader();
                const decoder = new TextDecoder();
                let content = '';
                let thinking = '';
                let msgDiv = null;
                let hasThinking = false;

                removeLoading();

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    const chunk = decoder.decode(value, { stream: true });
                    const lines = chunk.split('\n');
                    for (const line of lines) {
                        const trimmed = line.trim();
                        if (!trimmed || !trimmed.startsWith('data:')) continue;
                        const data = trimmed.slice(5).trim();
                        if (data === '[DONE]') continue;
                        try {
                            const parsed = JSON.parse(data);
                            const delta = parsed.choices?.[0]?.delta;
                            if (!delta) continue;
                            if (delta.reasoning_content) {
                                thinking += delta.reasoning_content;
                                hasThinking = true;
                            }
                            if (delta.content) {
                                content += delta.content;
                            }
                            if (!msgDiv && (content || thinking)) {
                                msgDiv = appendMsg('assistant', content, hasThinking ? thinking : '');
                            } else if (msgDiv) {
                                const contentEl = msgDiv.querySelector('.ds-msg-content');
                                let html = '';
                                if (hasThinking) {
                                    html += '<div class="ds-thinking">🤔 思考中…<br/>' + escapeHTML(thinking).replace(/\n/g, '<br>') + '</div>';
                                }
                                html += marked.parse(content);
                                contentEl.innerHTML = html;
                            }
                            dsMessages.scrollTop = dsMessages.scrollHeight;
                        } catch (_) {}
                    }
                }

                messages.push({ role: 'assistant', content: content });
            } catch (err) {
                removeLoading();
                appendMsg('assistant', '请求出错：' + err.message);
                showToast('请求失败: ' + err.message, 'error');
            } finally {
                isSending = false;
                dsSendBtn.disabled = false;
            }
        }

        dsSendBtn.addEventListener('click', send);
        dsInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                send();
            }
        });
        dsInput.addEventListener('input', () => {
            dsInput.style.height = 'auto';
            dsInput.style.height = Math.min(160, dsInput.scrollHeight) + 'px';
        });

        // ═══════════════════════════════════════════
        //  Tab switching
        // ═══════════════════════════════════════════
        const TAB_KEY = 'ds-active-tab';
        const tabBtns = document.querySelectorAll('.ds-tab-btn');
        const tabChat = document.getElementById('tab-chat');
        const tabGames = document.getElementById('tab-games');
        const tabZyad = document.getElementById('tab-zyad');
        let currentTab = localStorage.getItem(TAB_KEY) || 'chat';

        function switchTab(tab) {
            currentTab = tab;
            localStorage.setItem(TAB_KEY, tab);
            tabBtns.forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
            tabChat.setAttribute('hidden', '');
            tabGames.setAttribute('hidden', '');
            tabZyad.setAttribute('hidden', '');
            if (tab === 'chat') {
                tabChat.removeAttribute('hidden');
                stopCurrentGame();
                if (window.zyadGame) window.zyadGame.pause();
                dsInput.focus();
            } else if (tab === 'games') {
                tabGames.removeAttribute('hidden');
                startCurrentGame();
                if (window.zyadGame) window.zyadGame.pause();
            } else if (tab === 'zyad') {
                tabZyad.removeAttribute('hidden');
                stopCurrentGame();
                if (window.zyadGame) window.zyadGame.start();
            }
        }

        tabBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                if (btn.dataset.tab !== currentTab) switchTab(btn.dataset.tab);
            });
        });

        // Restore saved tab
        if (currentTab !== 'chat') switchTab(currentTab);

        // ═══════════════════════════════════════════
        //  Game engine
        // ═══════════════════════════════════════════
        const gameCanvas = document.getElementById('gameCanvas');
        const gameCtx = gameCanvas.getContext('2d');
        const gameCanvasWrap = document.getElementById('gameCanvasWrap');
        const gameScoreEl = document.getElementById('gameScore');
        const gameHudExtra = document.getElementById('gameHudExtra');
        const gameHint = document.getElementById('gameHint');
        const gameSelector = document.getElementById('gameSelector');
        const touchControls = document.getElementById('touchControls');
        const difficultySelector = document.getElementById('difficultySelector');

        let currentGame = null;      // active game instance
        let currentGameId = 'snake';
        let currentDifficulty = 'medium';
        let activeGameInstance = null;

        // ── Difficulty selection ──
        function updateDifficultyUI() {
            difficultySelector.querySelectorAll('.ds-diff-btn').forEach(b => {
                b.classList.toggle('active', b.dataset.diff === currentDifficulty);
            });
            // Only show difficulty selector for snake
            difficultySelector.style.display = currentGameId === 'snake' ? '' : 'none';
        }

        difficultySelector.addEventListener('click', (e) => {
            const btn = e.target.closest('.ds-diff-btn');
            if (!btn) return;
            const diff = btn.dataset.diff;
            if (diff === currentDifficulty) return;
            currentDifficulty = diff;
            updateDifficultyUI();
            // Restart if snake game is currently showing
            if (currentGameId === 'snake' && currentTab === 'games' && activeGameInstance) {
                startCurrentGame();
            }
        });

        // ── Game card selection ──
        gameSelector.addEventListener('click', (e) => {
            const card = e.target.closest('.ds-game-card');
            if (!card) return;
            const gameId = card.dataset.game;
            if (gameId === currentGameId) return;
            currentGameId = gameId;
            gameSelector.querySelectorAll('.ds-game-card').forEach(c => c.classList.remove('active'));
            card.classList.add('active');
            updateDifficultyUI();
            if (currentTab === 'games') startCurrentGame();
        });

        // ── Touch controls ──
        touchControls.addEventListener('click', (e) => {
            const btn = e.target.closest('.ds-touch-btn');
            if (!btn || !activeGameInstance) return;
            const key = btn.dataset.key;
            if (activeGameInstance.handleKey) activeGameInstance.handleKey(key);
        });
        // Prevent touch buttons from stealing focus / triggering zoom
        touchControls.addEventListener('touchstart', (e) => {
            const btn = e.target.closest('.ds-touch-btn');
            if (!btn || !activeGameInstance) return;
            e.preventDefault();
            const key = btn.dataset.key;
            if (activeGameInstance.handleKey) activeGameInstance.handleKey(key);
        });

        // ── Keyboard ──
        function onGameKey(e) {
            if (currentTab !== 'games' || !activeGameInstance) return;
            // Prevent page scroll on arrow keys / space
            if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key)) {
                e.preventDefault();
            }
            if (activeGameInstance.handleKey) {
                activeGameInstance.handleKey(e.key);
            }
        }
        document.addEventListener('keydown', onGameKey);

        // ── Mouse / touch move for paddle games ──
        function onGameMouseMove(e) {
            if (currentTab !== 'games' || !activeGameInstance || !activeGameInstance.handleMouse) return;
            const rect = gameCanvas.getBoundingClientRect();
            const scaleX = gameCanvas.width / rect.width;
            const x = (e.clientX - rect.left) * scaleX;
            activeGameInstance.handleMouse(x);
        }
        gameCanvas.addEventListener('mousemove', onGameMouseMove);
        gameCanvas.addEventListener('touchmove', (e) => {
            if (currentTab !== 'games' || !activeGameInstance || !activeGameInstance.handleMouse) return;
            e.preventDefault();
            const rect = gameCanvas.getBoundingClientRect();
            const scaleX = gameCanvas.width / rect.width;
            const x = (e.touches[0].clientX - rect.left) * scaleX;
            activeGameInstance.handleMouse(x);
        }, { passive: false });
        gameCanvas.addEventListener('click', (e) => {
            if (currentTab !== 'games' || !activeGameInstance || !activeGameInstance.handleClick) return;
            activeGameInstance.handleClick();
        });

        function startCurrentGame() {
            stopCurrentGame();
            gameCanvasWrap.querySelectorAll('.ds-game-overlay').forEach(el => el.remove());
            gameScoreEl.textContent = '0';
            gameHudExtra.textContent = '';
            updateDifficultyUI();

            // Overlay for game start
            const overlay = document.createElement('div');
            overlay.className = 'ds-game-overlay';
            overlay.id = 'gameStartOverlay';
            overlay.innerHTML = '<div class="ds-game-overlay-title">🎮 按任意方向键开始</div><button id="gameStartBtn">开始游戏</button>';
            gameCanvasWrap.appendChild(overlay);

            const startBtn = document.getElementById('gameStartBtn');
            const startGame = () => {
                const ov = document.getElementById('gameStartOverlay');
                if (ov) ov.remove();
                launchGame(currentGameId);
            };
            startBtn.addEventListener('click', startGame);

            // Also start on arrow key / space / wasd
            const onceStart = (e) => {
                if (currentTab !== 'games') return;
                if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' ','w','a','s','d','W','A','S','D'].includes(e.key)) {
                    document.removeEventListener('keydown', onceStart);
                    const ov = document.getElementById('gameStartOverlay');
                    if (ov) ov.remove();
                    launchGame(currentGameId);
                }
            };
            document.addEventListener('keydown', onceStart);
            // Store ref to clean up
            gameCanvasWrap._onceStart = onceStart;

            gameHint.textContent = '';
            resizeGameCanvas(currentGameId);
        }

        function stopCurrentGame() {
            if (activeGameInstance && activeGameInstance.stop) activeGameInstance.stop();
            activeGameInstance = null;
            if (gameCanvasWrap._onceStart) {
                document.removeEventListener('keydown', gameCanvasWrap._onceStart);
                gameCanvasWrap._onceStart = null;
            }
            gameCanvasWrap.querySelectorAll('.ds-game-overlay').forEach(el => el.remove());
        }

        function resizeGameCanvas(gameId) {
            switch (gameId) {
                case 'snake':   gameCanvas.width = 400; gameCanvas.height = 400; break;
                case 'tetris':  gameCanvas.width = 300; gameCanvas.height = 600; break;
                case 'breakout': gameCanvas.width = 400; gameCanvas.height = 500; break;
            }
        }

        function launchGame(gameId) {
            stopCurrentGame();
            resizeGameCanvas(gameId);
            gameScoreEl.textContent = '0';
            gameHudExtra.textContent = '';

            switch (gameId) {
                case 'snake':   activeGameInstance = new SnakeGame(gameCanvas, gameCtx, gameScoreEl, gameHudExtra, gameHint, gameCanvasWrap, currentDifficulty); break;
                case 'tetris':  activeGameInstance = new TetrisGame(gameCanvas, gameCtx, gameScoreEl, gameHudExtra, gameHint, gameCanvasWrap); break;
                case 'breakout': activeGameInstance = new BreakoutGame(gameCanvas, gameCtx, gameScoreEl, gameHudExtra, gameHint, gameCanvasWrap); break;
            }
            if (activeGameInstance && activeGameInstance.start) activeGameInstance.start();
        }

        // ═══════════════════════════════════════════
        //  Snake Game
        // ═══════════════════════════════════════════
        class SnakeGame {
            constructor(canvas, ctx, scoreEl, extraEl, hintEl, wrapEl, difficulty) {
                this.canvas = canvas;
                this.ctx = ctx;
                this.scoreEl = scoreEl;
                this.extraEl = extraEl;
                this.hintEl = hintEl;
                this.wrapEl = wrapEl;
                this.difficulty = difficulty || 'medium';
                this.gs = 20; // grid size
                this.cols = Math.floor(canvas.width / this.gs);
                this.rows = Math.floor(canvas.height / this.gs);
                this.running = false;
                this.rafId = null;
                this.lastTick = 0;
                this.gameOver = true; // ensure reset() runs on first start
                // Difficulty presets
                const presets = {
                    easy:   { speed: 300, dec: 0, wrap: false, label: '简单' },
                    medium: { speed: 240, dec: 1, wrap: false, label: '中等' },
                    hard:   { speed: 170, dec: 2, wrap: false, label: '困难' },
                };
                this.diffConfig = presets[this.difficulty] || presets.medium;
                this.speed = this.diffConfig.speed;
                this._pauseOverlayEl = null;
            }

            reset() {
                // Random head position, at least 2 cells from edges, and head must have room for 2 body segments in opposite direction
                const margin = 2;
                const headX = margin + Math.floor(Math.random() * (this.cols - 2 * margin));
                const headY = margin + Math.floor(Math.random() * (this.rows - 2 * margin));
                // Random direction
                const dirs = [{ x: 1, y: 0 }, { x: -1, y: 0 }, { x: 0, y: 1 }, { x: 0, y: -1 }];
                const validDirs = dirs.filter(d => {
                    const tailX = headX - d.x * 2;
                    const tailY = headY - d.y * 2;
                    return tailX >= 0 && tailX < this.cols && tailY >= 0 && tailY < this.rows;
                });
                const dir = validDirs[Math.floor(Math.random() * validDirs.length)] || { x: 1, y: 0 };
                // Build snake: head at [2], body at [1], tail at [0]
                this.snake = [];
                for (let i = 2; i >= 0; i--) {
                    this.snake.push({ x: headX - dir.x * i, y: headY - dir.y * i });
                }
                this.dir = { ...dir };
                this.dirQueue = [];
                this.food = this._randomFood();
                this.score = 0;
                this.gameOver = false;
                this.started = false;
                this.paused = false;
                this.speed = this.diffConfig.speed;
                this.scoreEl.textContent = '0';
                this.extraEl.textContent = '难度: ' + this.diffConfig.label + ' | 长度: 3';
                this.hintEl.textContent = '按方向键开始移动';
            }

            _randomFood() {
                let p;
                do {
                    p = { x: Math.floor(Math.random() * this.cols), y: Math.floor(Math.random() * this.rows) };
                } while (this.snake.some(s => s.x === p.x && s.y === p.y));
                return p;
            }

            handleKey(key) {
                // Space: toggle pause / resume
                if (key === ' ') {
                    if (this.gameOver) return;
                    if (!this.started) return;
                    if (this.paused) {
                        this._resume();
                    } else {
                        this._pause();
                    }
                    return;
                }

                const map = { ArrowUp: [0,-1], ArrowDown: [0,1], ArrowLeft: [-1,0], ArrowRight: [1,0], w: [0,-1], s: [0,1], a: [-1,0], d: [1,0], W: [0,-1], S: [0,1], A: [-1,0], D: [1,0] };
                const d = map[key];
                if (!d) return;

                // First direction key starts the snake moving
                if (!this.started) {
                    this.started = true;
                    this.paused = false;
                    this.lastTick = performance.now();
                    this.hintEl.textContent = '方向键 / WASD 控制方向 | 空格暂停';
                }
                if (this.paused) return;

                // Check against the last buffered direction (or current dir if none buffered)
                const last = this.dirQueue.length > 0 ? this.dirQueue[this.dirQueue.length - 1] : this.dir;
                if (last.x + d[0] === 0 && last.y + d[1] === 0) return; // no reverse
                if (this.dirQueue.length < 2) {
                    this.dirQueue.push({ x: d[0], y: d[1] });
                }
            }

            update(ts) {
                if (this.gameOver || !this.running) return;
                if (!this.started || this.paused) return;
                if (ts - this.lastTick < this.speed) return;
                this.lastTick = ts;

                // Consume one buffered direction per tick
                if (this.dirQueue.length > 0) {
                    this.dir = this.dirQueue.shift();
                }
                const head = this.snake[this.snake.length - 1];
                const nx = head.x + this.dir.x;
                const ny = head.y + this.dir.y;

                // Wall collision
                if (nx < 0 || nx >= this.cols || ny < 0 || ny >= this.rows) {
                    this._end();
                    return;
                }
                // Self collision
                if (this.snake.some(s => s.x === nx && s.y === ny)) {
                    this._end();
                    return;
                }

                this.snake.push({ x: nx, y: ny });

                if (nx === this.food.x && ny === this.food.y) {
                    this.score += 10;
                    this.scoreEl.textContent = this.score;
                    this.food = this._randomFood();
                    this.speed = Math.max(40, this.speed - this.diffConfig.dec);
                    this.extraEl.textContent = '难度: ' + this.diffConfig.label + ' | 长度: ' + this.snake.length;
                } else {
                    this.snake.shift();
                }
            }

            draw() {
                const ctx = this.ctx;
                const gs = this.gs;
                const w = this.canvas.width;
                const h = this.canvas.height;

                // Clear
                ctx.clearRect(0, 0, w, h);
                ctx.fillStyle = '#1a1a2e';
                ctx.fillRect(0, 0, w, h);

                // Grid
                ctx.strokeStyle = 'rgba(255,255,255,0.03)';
                ctx.lineWidth = 0.5;
                for (let x = 0; x <= this.cols; x++) { ctx.beginPath(); ctx.moveTo(x * gs, 0); ctx.lineTo(x * gs, h); ctx.stroke(); }
                for (let y = 0; y <= this.rows; y++) { ctx.beginPath(); ctx.moveTo(0, y * gs); ctx.lineTo(w, y * gs); ctx.stroke(); }

                // Food
                const fx = this.food.x * gs + gs / 2;
                const fy = this.food.y * gs + gs / 2;
                const pulse = 1 + 0.15 * Math.sin(performance.now() / 200);
                ctx.fillStyle = '#ff4757';
                ctx.shadowColor = '#ff4757';
                ctx.shadowBlur = 10;
                ctx.beginPath();
                ctx.arc(fx, fy, (gs / 2 - 2) * pulse, 0, Math.PI * 2);
                ctx.fill();
                ctx.shadowBlur = 0;

                // Snake
                this.snake.forEach((seg, i) => {
                    const isHead = i === this.snake.length - 1;
                    const grad = ctx.createLinearGradient(seg.x * gs, seg.y * gs, seg.x * gs + gs, seg.y * gs + gs);
                    if (isHead) {
                        grad.addColorStop(0, '#f9ca24');
                        grad.addColorStop(1, '#e0a800');
                    } else {
                        const t = i / Math.max(1, this.snake.length - 2);
                        grad.addColorStop(0, `hsl(${140 + t * 30}, 70%, ${45 + t * 10}%)`);
                        grad.addColorStop(1, `hsl(${140 + t * 30}, 70%, ${38 + t * 10}%)`);
                    }
                    ctx.fillStyle = grad;
                    ctx.shadowColor = isHead ? '#f9ca24' : '#2ecc71';
                    ctx.shadowBlur = isHead ? 12 : 4;
                    ctx.fillRect(seg.x * gs + 1, seg.y * gs + 1, gs - 2, gs - 2);
                });
                ctx.shadowBlur = 0;
            }

            _end() {
                this.gameOver = true;
                this.running = false;
                this._hidePauseOverlay();
                if (this.rafId) { cancelAnimationFrame(this.rafId); this.rafId = null; }
                this._showOverlay('🐍 游戏结束', '得分: ' + this.score);
            }

            _showOverlay(title, subtitle) {
                this._hidePauseOverlay();
                const ov = document.createElement('div');
                ov.className = 'ds-game-overlay';
                ov.innerHTML = '<div class="ds-game-overlay-title">' + title + '</div><div>' + subtitle + ' | 难度: ' + this.diffConfig.label + '</div><button>再来一局</button>';
                ov.querySelector('button').addEventListener('click', () => {
                    ov.remove();
                    this.reset();
                    this.start();
                });
                this.wrapEl.appendChild(ov);
            }

            _pause() {
                this.paused = true;
                this._showPauseOverlay();
            }

            _resume() {
                this.paused = false;
                this.lastTick = performance.now();
                this._hidePauseOverlay();
                this.hintEl.textContent = '方向键 / WASD 控制方向 | 空格暂停';
            }

            _showPauseOverlay() {
                if (this._pauseOverlayEl) return;
                const ov = document.createElement('div');
                ov.className = 'ds-game-overlay';
                ov.id = 'snakePauseOverlay';
                ov.innerHTML = '<div class="ds-game-overlay-title">⏸️ 暂停中</div><div>按空格键继续</div>';
                this.wrapEl.appendChild(ov);
                this._pauseOverlayEl = ov;
            }

            _hidePauseOverlay() {
                if (this._pauseOverlayEl) {
                    this._pauseOverlayEl.remove();
                    this._pauseOverlayEl = null;
                }
            }

            loop(ts) {
                if (!this.running) return;
                this.update(ts);
                this.draw();
                this.rafId = requestAnimationFrame(t => this.loop(t));
            }

            start() {
                if (this.gameOver) this.reset();
                this.running = true;
                this.lastTick = performance.now();
                this.rafId = requestAnimationFrame(t => this.loop(t));
            }

            stop() {
                this.running = false;
                this._hidePauseOverlay();
                if (this.rafId) { cancelAnimationFrame(this.rafId); this.rafId = null; }
            }
        }

        // ═══════════════════════════════════════════
        //  Tetris Game
        // ═══════════════════════════════════════════
        class TetrisGame {
            constructor(canvas, ctx, scoreEl, extraEl, hintEl, wrapEl) {
                this.canvas = canvas;
                this.ctx = ctx;
                this.scoreEl = scoreEl;
                this.extraEl = extraEl;
                this.hintEl = hintEl;
                this.wrapEl = wrapEl;
                this.cols = 10;
                this.rows = 20;
                this.cs = 30; // cell size
                this.running = false;
                this.rafId = null;
                this.lastDrop = 0;
                this.dropInterval = 800;
                this.gameOver = true; // ensure reset() runs on first start
            }

            reset() {
                this.board = Array.from({ length: this.rows }, () => Array(this.cols).fill(null));
                this.score = 0;
                this.linesCleared = 0;
                this.level = 1;
                this.gameOver = false;
                this.dropInterval = 800;
                this.scoreEl.textContent = '0';
                this.extraEl.textContent = '等级: 1 | 行数: 0';
                this.hintEl.textContent = '← → 移动  ↑ 旋转  ↓ 加速  Space 硬降';
                this._spawnPiece();
            }

            _PIECES() {
                return [
                    { shape: [[1,1,1,1]], color: '#00f0f0' },
                    { shape: [[1,1],[1,1]], color: '#f0f000' },
                    { shape: [[0,1,0],[1,1,1]], color: '#a000f0' },
                    { shape: [[1,0,0],[1,1,1]], color: '#0000f0' },
                    { shape: [[0,0,1],[1,1,1]], color: '#f0a000' },
                    { shape: [[0,1,1],[1,1,0]], color: '#00f000' },
                    { shape: [[1,1,0],[0,1,1]], color: '#f00000' },
                ];
            }

            _spawnPiece() {
                const pieces = this._PIECES();
                const def = pieces[Math.floor(Math.random() * pieces.length)];
                this.piece = {
                    shape: def.shape.map(r => [...r]),
                    color: def.color,
                    x: Math.floor((this.cols - def.shape[0].length) / 2),
                    y: 0
                };
                // Next piece
                if (!this.nextPiece) {
                    const nd = pieces[Math.floor(Math.random() * pieces.length)];
                    this.nextPiece = { shape: nd.shape.map(r => [...r]), color: nd.color };
                } else {
                    this.piece = { ...this.nextPiece, x: Math.floor((this.cols - this.nextPiece.shape[0].length) / 2), y: 0 };
                    const nd = pieces[Math.floor(Math.random() * pieces.length)];
                    this.nextPiece = { shape: nd.shape.map(r => [...r]), color: nd.color };
                }
                if (!this._valid(this.piece.shape, this.piece.x, this.piece.y)) {
                    this._end();
                }
            }

            _valid(shape, px, py) {
                for (let r = 0; r < shape.length; r++) {
                    for (let c = 0; c < shape[r].length; c++) {
                        if (!shape[r][c]) continue;
                        const bx = px + c;
                        const by = py + r;
                        if (bx < 0 || bx >= this.cols || by >= this.rows) return false;
                        if (by < 0) continue;
                        if (this.board[by][bx] !== null) return false;
                    }
                }
                return true;
            }

            _place() {
                const { shape, x, y, color } = this.piece;
                for (let r = 0; r < shape.length; r++) {
                    for (let c = 0; c < shape[r].length; c++) {
                        if (!shape[r][c]) continue;
                        const by = y + r;
                        if (by < 0) { this._end(); return; }
                        this.board[by][x + c] = color;
                    }
                }
                // Clear lines
                let cleared = 0;
                for (let r = this.rows - 1; r >= 0; r--) {
                    if (this.board[r].every(cell => cell !== null)) {
                        this.board.splice(r, 1);
                        this.board.unshift(Array(this.cols).fill(null));
                        cleared++;
                        r++; // re-check this row
                    }
                }
                if (cleared > 0) {
                    const pts = [0, 100, 300, 500, 800];
                    this.score += (pts[cleared] || cleared * 200) * this.level;
                    this.linesCleared += cleared;
                    this.level = Math.floor(this.linesCleared / 10) + 1;
                    this.dropInterval = Math.max(50, 800 - (this.level - 1) * 60);
                    this.scoreEl.textContent = this.score;
                    this.extraEl.textContent = '等级: ' + this.level + ' | 行数: ' + this.linesCleared;
                }
                this._spawnPiece();
            }

            _rotate(shape) {
                // Rotate clockwise: transpose + reverse rows
                const rows = shape.length;
                const cols = shape[0].length;
                const rotated = Array.from({ length: cols }, () => Array(rows).fill(0));
                for (let r = 0; r < rows; r++) {
                    for (let c = 0; c < cols; c++) {
                        rotated[c][rows - 1 - r] = shape[r][c];
                    }
                }
                return rotated;
            }

            handleKey(key) {
                if (this.gameOver || !this.running) return;
                if (key === 'ArrowLeft') {
                    if (this._valid(this.piece.shape, this.piece.x - 1, this.piece.y)) this.piece.x--;
                } else if (key === 'ArrowRight') {
                    if (this._valid(this.piece.shape, this.piece.x + 1, this.piece.y)) this.piece.x++;
                } else if (key === 'ArrowDown') {
                    if (this._valid(this.piece.shape, this.piece.x, this.piece.y + 1)) {
                        this.piece.y++;
                        this.score += 1;
                        this.scoreEl.textContent = this.score;
                    }
                } else if (key === 'ArrowUp') {
                    const rot = this._rotate(this.piece.shape);
                    // Try basic, then wall kicks
                    const kicks = [0, -1, 1, -2, 2];
                    for (const dx of kicks) {
                        if (this._valid(rot, this.piece.x + dx, this.piece.y)) {
                            this.piece.shape = rot;
                            this.piece.x += dx;
                            break;
                        }
                    }
                } else if (key === ' ') {
                    // Hard drop
                    while (this._valid(this.piece.shape, this.piece.x, this.piece.y + 1)) {
                        this.piece.y++;
                        this.score += 2;
                    }
                    this.scoreEl.textContent = this.score;
                    this._place();
                }
            }

            update(ts) {
                if (this.gameOver || !this.running) return;
                if (ts - this.lastDrop < this.dropInterval) return;
                this.lastDrop = ts;
                if (this._valid(this.piece.shape, this.piece.x, this.piece.y + 1)) {
                    this.piece.y++;
                } else {
                    this._place();
                }
            }

            draw() {
                const ctx = this.ctx;
                const cs = this.cs;
                const w = this.canvas.width;
                const h = this.canvas.height;

                // Background
                ctx.fillStyle = '#0a0a0f';
                ctx.fillRect(0, 0, w, h);

                // Board grid
                ctx.strokeStyle = 'rgba(255,255,255,0.03)';
                ctx.lineWidth = 0.5;
                for (let x = 0; x <= this.cols; x++) { ctx.beginPath(); ctx.moveTo(x * cs, 0); ctx.lineTo(x * cs, this.rows * cs); ctx.stroke(); }
                for (let y = 0; y <= this.rows; y++) { ctx.beginPath(); ctx.moveTo(0, y * cs); ctx.lineTo(this.cols * cs, y * cs); ctx.stroke(); }

                // Placed blocks
                for (let r = 0; r < this.rows; r++) {
                    for (let c = 0; c < this.cols; c++) {
                        if (this.board[r][c]) {
                            ctx.fillStyle = this.board[r][c];
                            ctx.shadowColor = this.board[r][c];
                            ctx.shadowBlur = 4;
                            ctx.fillRect(c * cs + 1, r * cs + 1, cs - 2, cs - 2);
                            // Highlight
                            ctx.fillStyle = 'rgba(255,255,255,0.15)';
                            ctx.fillRect(c * cs + 1, r * cs + 1, cs - 2, 4);
                        }
                    }
                }
                ctx.shadowBlur = 0;

                // Current piece (ghost + piece)
                if (this.piece && !this.gameOver) {
                    // Ghost
                    let gy = this.piece.y;
                    while (this._valid(this.piece.shape, this.piece.x, gy + 1)) gy++;
                    if (gy !== this.piece.y) {
                        this._drawPiece(this.piece.shape, this.piece.x, gy, 'rgba(255,255,255,0.12)');
                    }
                    this._drawPiece(this.piece.shape, this.piece.x, this.piece.y, this.piece.color);
                }
            }

            _drawPiece(shape, px, py, color) {
                const ctx = this.ctx;
                const cs = this.cs;
                for (let r = 0; r < shape.length; r++) {
                    for (let c = 0; c < shape[r].length; c++) {
                        if (!shape[r][c]) continue;
                        const bx = (px + c) * cs;
                        const by = (py + r) * cs;
                        if (py + r < 0) continue;
                        ctx.fillStyle = color;
                        ctx.shadowColor = color;
                        ctx.shadowBlur = 4;
                        ctx.fillRect(bx + 1, by + 1, cs - 2, cs - 2);
                        if (color !== 'rgba(255,255,255,0.12)') {
                            ctx.fillStyle = 'rgba(255,255,255,0.15)';
                            ctx.fillRect(bx + 1, by + 1, cs - 2, 4);
                        }
                    }
                }
                ctx.shadowBlur = 0;
            }

            _end() {
                this.gameOver = true;
                this.running = false;
                if (this.rafId) { cancelAnimationFrame(this.rafId); this.rafId = null; }
                const ov = document.createElement('div');
                ov.className = 'ds-game-overlay';
                ov.innerHTML = '<div class="ds-game-overlay-title">🧱 游戏结束</div><div>得分: ' + this.score + ' | 等级: ' + this.level + '</div><button>再来一局</button>';
                ov.querySelector('button').addEventListener('click', () => { ov.remove(); this.reset(); this.start(); });
                this.wrapEl.appendChild(ov);
            }

            loop(ts) {
                if (!this.running) return;
                this.update(ts);
                this.draw();
                this.rafId = requestAnimationFrame(t => this.loop(t));
            }

            start() {
                if (this.gameOver) this.reset();
                this.running = true;
                this.lastDrop = performance.now();
                this.rafId = requestAnimationFrame(t => this.loop(t));
            }

            stop() {
                this.running = false;
                if (this.rafId) { cancelAnimationFrame(this.rafId); this.rafId = null; }
            }
        }

        // ═══════════════════════════════════════════
        //  Breakout Game
        // ═══════════════════════════════════════════
        class BreakoutGame {
            constructor(canvas, ctx, scoreEl, extraEl, hintEl, wrapEl) {
                this.canvas = canvas;
                this.ctx = ctx;
                this.scoreEl = scoreEl;
                this.extraEl = extraEl;
                this.hintEl = hintEl;
                this.wrapEl = wrapEl;
                this.w = canvas.width;
                this.h = canvas.height;
                this.running = false;
                this.rafId = null;
                this.paddleW = 80;
                this.paddleH = 14;
                this.ballR = 7;
                this.lives = 3;
                this.brickRows = 6;
                this.brickCols = 8;
                this.brickW = (this.w - 40) / this.brickCols;
                this.brickH = 20;
                this.brickPad = 4;
                this.brickTop = 50;
                this.brickLeft = 20;
                this.gameOver = true; // ensure reset() runs on first start
            }

            reset() {
                this.paddleX = this.w / 2 - this.paddleW / 2;
                this.ballX = this.w / 2;
                this.ballY = this.h - 40;
                this.ballDX = 0;
                this.ballDY = 0;
                this.ballLaunched = false;
                this.lives = 3;
                this.score = 0;
                this.gameOver = false;
                this.scoreEl.textContent = '0';
                this.extraEl.textContent = '生命: ❤️❤️❤️';
                this.hintEl.textContent = '鼠标 / ← → 移动挡板  |  点击或按空格发球';

                const colors = ['#ff4757','#ff6b35','#ffc048','#2ed573','#1e90ff','#a55eea'];
                this.bricks = [];
                for (let r = 0; r < this.brickRows; r++) {
                    this.bricks[r] = [];
                    for (let c = 0; c < this.brickCols; c++) {
                        this.bricks[r][c] = { alive: true, color: colors[r % colors.length], points: (this.brickRows - r) * 10 };
                    }
                }
            }

            handleKey(key) {
                if (key === 'ArrowLeft') this._movePaddle(-1);
                if (key === 'ArrowRight') this._movePaddle(1);
                if (key === ' ') { if (!this.ballLaunched && !this.gameOver) this._launchBall(); }
            }

            handleMouse(x) {
                this.paddleX = Math.max(0, Math.min(this.w - this.paddleW, x - this.paddleW / 2));
            }

            handleClick() {
                if (!this.ballLaunched && !this.gameOver) this._launchBall();
            }

            _movePaddle(dir) {
                const speed = 8;
                this.paddleX = Math.max(0, Math.min(this.w - this.paddleW, this.paddleX + dir * speed));
            }

            _launchBall() {
                const angle = (Math.random() - 0.5) * 0.8 + Math.PI / 2; // Upward angle
                const speed = 5;
                this.ballDX = Math.cos(angle) * speed;
                this.ballDY = -Math.sin(angle) * speed;
                this.ballLaunched = true;
                this.hintEl.textContent = '';
            }

            update(ts) {
                if (this.gameOver || !this.running) return;

                if (this.ballLaunched) {
                    this.ballX += this.ballDX;
                    this.ballY += this.ballDY;

                    // Wall collisions
                    if (this.ballX - this.ballR <= 0) { this.ballX = this.ballR; this.ballDX = Math.abs(this.ballDX); }
                    if (this.ballX + this.ballR >= this.w) { this.ballX = this.w - this.ballR; this.ballDX = -Math.abs(this.ballDX); }
                    if (this.ballY - this.ballR <= 0) { this.ballY = this.ballR; this.ballDY = Math.abs(this.ballDY); }

                    // Bottom - lose life
                    if (this.ballY + this.ballR >= this.h) {
                        this.lives--;
                        this.extraEl.textContent = '生命: ' + '❤️'.repeat(Math.max(0, this.lives));
                        if (this.lives <= 0) {
                            this._end();
                            return;
                        }
                        this.ballLaunched = false;
                        this.ballX = this.paddleX + this.paddleW / 2;
                        this.ballY = this.h - 40;
                        this.ballDX = 0;
                        this.ballDY = 0;
                        this.hintEl.textContent = '点击或按空格重新发球';
                    }

                    // Paddle collision
                    if (this.ballDY > 0 &&
                        this.ballY + this.ballR >= this.h - 30 &&
                        this.ballY + this.ballR <= this.h - 30 + this.paddleH + 6 &&
                        this.ballX >= this.paddleX - this.ballR &&
                        this.ballX <= this.paddleX + this.paddleW + this.ballR) {
                        // Calculate bounce angle based on hit position
                        const hitPos = (this.ballX - this.paddleX) / this.paddleW; // 0..1
                        const angle = (hitPos - 0.5) * Math.PI * 0.7; // -63° to +63°
                        const speed = Math.sqrt(this.ballDX ** 2 + this.ballDY ** 2);
                        this.ballDX = Math.sin(angle) * speed;
                        this.ballDY = -Math.abs(Math.cos(angle) * speed);
                        this.ballY = this.h - 30 - this.ballR;
                    }

                    // Brick collision
                    let hitBrick = false;
                    for (let r = 0; r < this.brickRows && !hitBrick; r++) {
                        for (let c = 0; c < this.brickCols && !hitBrick; c++) {
                            const b = this.bricks[r][c];
                            if (!b.alive) continue;
                            const bx = this.brickLeft + c * (this.brickW + this.brickPad);
                            const by = this.brickTop + r * (this.brickH + this.brickPad);
                            if (this.ballX + this.ballR > bx && this.ballX - this.ballR < bx + this.brickW &&
                                this.ballY + this.ballR > by && this.ballY - this.ballR < by + this.brickH) {
                                b.alive = false;
                                this.score += b.points;
                                this.scoreEl.textContent = this.score;
                                this.ballDY = -this.ballDY;
                                hitBrick = true;

                                // Check win
                                if (this.bricks.every(row => row.every(brick => !brick.alive))) {
                                    this.ballLaunched = false;
                                    this.ballDX = 0;
                                    this.ballDY = 0;
                                    this.hintEl.textContent = '🎉 全部清除！';
                                    // Spawn new level after delay
                                    setTimeout(() => {
                                        if (!this.running) return;
                                        this.brickRows = Math.min(8, this.brickRows + 1);
                                        this._respawnBricks();
                                        this.ballLaunched = false;
                                        this.ballX = this.paddleX + this.paddleW / 2;
                                        this.ballY = this.h - 40;
                                        this.hintEl.textContent = '新关卡！点击或按空格发球';
                                    }, 1500);
                                }
                            }
                        }
                    }
                } else {
                    // Ball follows paddle
                    this.ballX = this.paddleX + this.paddleW / 2;
                }
            }

            _respawnBricks() {
                const colors = ['#ff4757','#ff6b35','#ffc048','#2ed573','#1e90ff','#a55eea','#ff4757','#ff6b35'];
                this.bricks = [];
                for (let r = 0; r < this.brickRows; r++) {
                    this.bricks[r] = [];
                    for (let c = 0; c < this.brickCols; c++) {
                        this.bricks[r][c] = { alive: true, color: colors[r % colors.length], points: (this.brickRows - r) * 10 };
                    }
                }
            }

            draw() {
                const ctx = this.ctx;
                const w = this.w;
                const h = this.h;

                ctx.fillStyle = '#0a0a0f';
                ctx.fillRect(0, 0, w, h);

                // Bricks
                for (let r = 0; r < this.brickRows; r++) {
                    for (let c = 0; c < this.brickCols; c++) {
                        const b = this.bricks[r][c];
                        if (!b.alive) continue;
                        const bx = this.brickLeft + c * (this.brickW + this.brickPad);
                        const by = this.brickTop + r * (this.brickH + this.brickPad);
                        ctx.fillStyle = b.color;
                        ctx.shadowColor = b.color;
                        ctx.shadowBlur = 6;
                        ctx.fillRect(bx, by, this.brickW, this.brickH);
                        // Highlight
                        ctx.fillStyle = 'rgba(255,255,255,0.2)';
                        ctx.fillRect(bx + 2, by + 1, this.brickW - 4, 4);
                    }
                }
                ctx.shadowBlur = 0;

                // Paddle
                const py = h - 30;
                const grad = ctx.createLinearGradient(this.paddleX, py, this.paddleX, py + this.paddleH);
                grad.addColorStop(0, '#60a5fa');
                grad.addColorStop(1, '#3b82f6');
                ctx.fillStyle = grad;
                ctx.shadowColor = '#60a5fa';
                ctx.shadowBlur = 12;
                ctx.fillRect(this.paddleX, py, this.paddleW, this.paddleH);
                ctx.fillStyle = 'rgba(255,255,255,0.2)';
                ctx.fillRect(this.paddleX + 2, py + 1, this.paddleW - 4, 4);
                ctx.shadowBlur = 0;

                // Ball
                ctx.fillStyle = '#fff';
                ctx.shadowColor = '#fff';
                ctx.shadowBlur = 16;
                ctx.beginPath();
                ctx.arc(this.ballX, this.ballY, this.ballR, 0, Math.PI * 2);
                ctx.fill();
                ctx.shadowBlur = 0;
            }

            _end() {
                this.gameOver = true;
                this.running = false;
                if (this.rafId) { cancelAnimationFrame(this.rafId); this.rafId = null; }
                const ov = document.createElement('div');
                ov.className = 'ds-game-overlay';
                ov.innerHTML = '<div class="ds-game-overlay-title">🏓 游戏结束</div><div>最终得分: ' + this.score + '</div><button>再来一局</button>';
                ov.querySelector('button').addEventListener('click', () => { ov.remove(); this.reset(); this.start(); });
                this.wrapEl.appendChild(ov);
            }

            loop(ts) {
                if (!this.running) return;
                this.update(ts);
                this.draw();
                this.rafId = requestAnimationFrame(t => this.loop(t));
            }

            start() {
                if (this.gameOver) this.reset();
                this.running = true;
                this.rafId = requestAnimationFrame(t => this.loop(t));
            }

            stop() {
                this.running = false;
                if (this.rafId) { cancelAnimationFrame(this.rafId); this.rafId = null; }
            }
        }

        // ── Initialize game UI (pre-load first game card) ──
        // The first game will be set up when user switches to the games tab
    })();
    </script>
    <script src="zyad-game.js"></script>
</body>
</html>
