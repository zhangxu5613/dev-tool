# zyad nginx 配置 - 游戏访问路径 https://sbtool.cn/zyad/
#
# 部署:
#   sudo cp zyad.nginx.conf /etc/nginx/conf.d/zyad.conf
#   sudo nginx -t && sudo nginx -s reload
#
# 路径设计:
#   - 静态文件: https://sbtool.cn/zyad/index.html (从 /var/www/dev-tool/zyad/ 取)
#   - 游戏 API: https://sbtool.cn/api/* (反代到 Python :8090, 不带 /zyad/ 前缀)
#   - WebSocket: https://sbtool.cn/local-room (反代到 Python :8091, 不带 /zyad/ 前缀)
#   - 网站根目录 https://sbtool.cn/ 保留给其他用途

server {
    listen 443 ssl;
    server_name sbtool.cn;

    ssl_certificate /etc/nginx/ssl/sbtool.cn_nginx/sbtool.cn_bundle.pem;
    ssl_certificate_key /etc/nginx/ssl/sbtool.cn_nginx/sbtool.cn.key;

    # 网站根目录 (保留给你其他用途, 游戏在子目录 zyad/)
    root /var/www/dev-tool;
    index index.html;

    # ===== 1. 网站根目录 (非游戏部分, 你原来的内容) =====
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ===== 2. 游戏静态文件 (/zyad/) =====
    # 访问 https://sbtool.cn/zyad/index.html -> /var/www/dev-tool/zyad/index.html
    location /zyad/ {
        # 不加 try_files 兜底, 404 就 404 (避免错误请求落到根 index.html)
        try_files $uri $uri/ =404;
    }

    # 游戏静态资源缓存
    location ~* ^/zyad/.*\.(js|css|png|jpg|jpeg|gif|webp|ico|woff2?)$ {
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
    }
    location ~* ^/zyad/.*\.(lh|ls|json|atlas|skel|txt|mp3|ogg|wav)$ {
        expires 5m;
        add_header Cache-Control "public, max-age=300";
    }

    # ===== 3. 游戏 HTTP API 反代到 Python :8090 =====
    # 注意: 不带 /zyad/ 前缀, 因为 bundle.js 里 fetch("/api/save") 是绝对路径
    location ~ ^/(api|zyyad|sys)/ {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location = /bestRank {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # ===== 4. WebSocket 房间反代到 Python :8091 =====
    # 注意: 不带 /zyad/ 前缀, 因为 local-multiplayer.js 里也是绝对路径
    location /local-room {
        proxy_pass http://127.0.0.1:8091;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # ===== 5. 保留你原来的 CORS 跨域代理 (/proxy/) =====
    location ~ ^/proxy/(https?):/+([^/]+)(/.*)?$ {
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' '*' always;
            add_header 'Access-Control-Allow-Headers' '*' always;
            return 204;
        }

        resolver 8.8.8.8 ipv6=off;

        set $target_path $3;
        if ($target_path = '') { set $target_path '/'; }

        proxy_pass $1://$2$target_path$is_args$args;
        proxy_set_header Host $2;
        proxy_ssl_server_name on;
        proxy_redirect off;

        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Methods;
        proxy_hide_header Access-Control-Allow-Headers;

        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' '*' always;
        add_header 'Access-Control-Allow-Headers' '*' always;
        add_header 'Access-Control-Expose-Headers' '*' always;
    }
}

# HTTP 80 自动跳转 HTTPS
server {
    listen 80;
    server_name sbtool.cn;
    return 301 https://$host$request_uri;
}
