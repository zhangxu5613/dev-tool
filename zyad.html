                const cx = (e.x + 0.5) * CELL + e.swayX * CELL;
                const cy = (e.y + 0.5) * CELL + e.swayY * CELL;
                const s = CELL * 0.72;
                if (_zuImgLoaded && _zuImg.complete) {
                    ctx.drawImage(_zuImg, cx - s / 2, cy - s / 2, s, s);
                } else {
                    ctx.fillStyle = '#c2410c';
                    ctx.fillRect(cx - s / 2, cy - s / 2, s, s);
                }
                // 血条
                const hpw = CELL * 0.8, ratio = Math.max(0, e.hp / e.maxHp);
                ctx.fillStyle = 'rgba(0,0,0,0.5)';
                ctx.fillRect(cx - hpw / 2, cy - s / 2 - 5, hpw, 3);
                ctx.fillStyle = '#ef4444';
                ctx.fillRect(cx - hpw / 2, cy - s / 2 - 5, hpw * ratio, 3);
                // 眩晕标记
                if (e.stun > 0) {
                    ctx.save();
                    ctx.fillStyle = '#fde047';
                    ctx.font = 'bold 12px sans-serif';
                    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                    ctx.fillText('★', cx, cy - s / 2 - 13);
                    ctx.restore();
                }
            }

            drawProjectile(ctx, p) {
                const x = (p.x + 0.5) * CELL, y = (p.y + 0.5) * CELL;
                if (p.defType === '枪') {
                    // 视觉飞矛：朝目标方向飞出的"木"字
                    const ang = Math.atan2(p.target.y - p.y, p.target.x - p.x) + Math.PI / 2;
                    const s = CELL * 0.42;
                    ctx.save();
                    ctx.translate(x, y);
                    ctx.rotate(ang);
                    if (_img.mu && _img.mu.complete) ctx.drawImage(_img.mu, -s / 2, -s * 0.9, s, s * 1.9);
                    else { ctx.fillStyle = '#4a3818'; ctx.font = '20px serif'; ctx.fillText('木', 0, 0); }
                    ctx.restore();
                } else {
                    // 箭矢（弓）：朝向 + 箭尾光晕
                    const ang = Math.atan2(p.target.y - p.y, p.target.x - p.x);
                    const len = CELL * 0.5;
                    ctx.save();
                    ctx.translate(x, y);
                    ctx.rotate(ang);
                    ctx.strokeStyle = '#fbbf24';
                    ctx.lineWidth = 2;
                    ctx.shadowBlur = 6; ctx.shadowColor = '#fbbf24';
                    ctx.beginPath();
                    ctx.moveTo(-len / 2, 0); ctx.lineTo(len / 2, 0);
                    ctx.stroke();
                    ctx.fillStyle = '#fbbf24';
                    ctx.beginPath();
                    ctx.moveTo(len / 2, 0); ctx.lineTo(len / 2 - 6, -4); ctx.lineTo(len / 2 - 6, 4);
                    ctx.closePath(); ctx.fill();
                    ctx.restore();
                }
            }

            drawEffect(ctx, ef) {
                const x = (ef.x + 0.5) * CELL, y = (ef.y + 0.5) * CELL;
                if (ef.isSpark) {
                    ctx.save();
                    ctx.globalAlpha = Math.max(0, 1 - ef.t / ef.life);
                    ctx.fillStyle = '#f59e0b';
                    ctx.beginPath();
                    ctx.arc(x, y, 3, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore();
                } else {
                    const yy = y - ef.t * 30;
                    ctx.save();
                    ctx.globalAlpha = Math.max(0, 1 - ef.t / 0.8);
                    ctx.font = 'bold 13px sans-serif';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.lineWidth = 3;
                    ctx.strokeStyle = '#000';
                    ctx.strokeText(ef.text, x, yy);
                    ctx.fillStyle = ef.cls === 'crit' ? '#fca5a5' : '#fbbf24';
                    ctx.fillText(ef.text, x, yy);
                    ctx.restore();
                }
            }

            drawInfoBox(ctx, d) {
                const stats = this.getEffectiveStats(d);
                const freq = (1 / stats.atkInterval).toFixed(2);
                const effRange = stats.range + 0.5;
                let minDist = Infinity, anyInRange = false;
                for (const e of this.enemies) {
                    const dist = Math.hypot(e.x - d.c, e.y - d.r);
                    if (dist < minDist) minDist = dist;
                    if (dist <= effRange) anyInRange = true;
                }
                const lines = [
                    (d.generalName ? d.generalName : DEFENDERS[d.type].name) + ' · ' + d.level,
                    '攻击力 ' + stats.damage.toFixed(1),
                    '范围 ' + stats.range + ' 格',
                    '频率 ' + freq + ' 次/秒',
                    '最近 ' + (minDist === Infinity ? '—' : minDist.toFixed(2)) + ' 格 ' + (anyInRange ? '(范围内)' : '(范围外)')
                ];
                if (d.generalName) lines.push('技能：' + SKILL_NAME[d.skill]);
                ctx.save();
                ctx.font = '11px sans-serif';
                ctx.textAlign = 'left';
                ctx.textBaseline = 'top';
                let w = 0;
                for (const l of lines) w = Math.max(w, ctx.measureText(l).width);
                const pad = 6, bh = lines.length * 14 + pad * 2, bw = w + pad * 2;
                let bx = (d.c + 0.5) * CELL - bw / 2;
                let by = d.r * CELL - bh - 4;
                if (by < 0) by = (d.r + 1) * CELL + 4;
                bx = Math.max(2, Math.min(BOARD_W - bw - 2, bx));
                ctx.fillStyle = 'rgba(20,14,8,0.92)';
                ctx.strokeStyle = '#c2410c';
                ctx.lineWidth = 1;
                _rr(ctx, bx, by, bw, bh, 6);
                ctx.fill(); ctx.stroke();
                for (let i = 0; i < lines.length; i++) {
                    ctx.fillStyle = i === 0 ? '#fbbf24' : '#fff';
                    ctx.fillText(lines[i], bx + pad, by + pad + i * 14);
                }
                ctx.restore();
            }

            updateDefenderHP(d) {
                // 血条已移除，无需更新
            }

            updateEnemyHP(e) {
                // 血条在 drawEnemy 中按 e.hp 直接绘制，无需更新 DOM
            }

            removeDefender(d) {
                const i = this.defenders.indexOf(d);
                if (i >= 0) this.defenders.splice(i, 1);
            }

            updateOdou() {
                if (this.isAI && this.aiBar) {
                    this.aiBar.querySelector('.zyad-ai-odou').textContent = Math.max(0, this.odouHP);
                }
            }

            updateAIBar() {
                if (this.aiBar) {
                    this.aiBar.querySelector('.zyad-ai-grain').textContent = Math.floor(this.grain);
                }
            }

            getDefenderAt(r, c) {
                return this.defenders.find(d => d.r === r && d.c === c);
            }

            aiAct() {
                if (this.grain >= this.recruitCost && this.cards.filter(c => !c.used).length < 3) {
                    this.recruit();
                }
                for (const card of this.cards) {
                    if (!card.used && card.type === 'shovel') {
                        const locked = [];
                        for (let r = 0; r < ROWS; r++) {
                            for (let c = 0; c < COLS; c++) {
                                if (this.grid[r][c] === TILE.LOCKED) locked.push([r, c]);
                            }
                        }
                        if (locked.length) {
                            const [r, c] = locked[Math.floor(Math.random() * locked.length)];
                            this.grid[r][c] = TILE.CLEARED; // 下一帧 drawFrame 自动刷新贴图
                            const idx = this.cards.indexOf(card);
                            this.useCard(idx);
                        }
                        break;
                    }
                }
                for (const card of this.cards) {
                    if (!card.used && card.type !== 'shovel') {
                        const spots = [];
                        for (let r = 0; r < ROWS; r++) {
                            for (let c = 0; c < COLS; c++) {
                                if (this.grid[r][c] === TILE.CLEARED && !this.getDefenderAt(r, c)) {
                                    spots.push([r, c]);
                                }
                            }
                        }
                        if (spots.length) {
                            const [r, c] = spots[Math.floor(Math.random() * spots.length)];
                            this.placeDefender(r, c, card.type);
                            const idx = this.cards.indexOf(card);
                            this.useCard(idx);
                        }
                        break;
                    }
                }
                this.refillCards();
            }
        }

        // ─────────── 全局游戏状态 ───────────
        const game = {
            leftBF: null,
            rightBF: null,
            wave: 1,
            maxWaves: 15,
            waveActive: false,
            waveCooldown: 2,
            recruitStarted: false,       // 第一波敌军需等玩家首次点「征兵」后才开始
            spawnPlan: [],
            spawnIndex: 0,
            spawnTimer: 0,
            paused: false,
            running: false,
            lastTime: 0,
            aiTimer: 0,
            selectedCard: null,
            selectedDefender: null,
            result: null,
            generalPool: [],            // 武将碎片剩余池（每局重置）
        };

        // ─────────── DOM ───────────
        const $ = (s) => document.querySelector(s);
        const arenaEl = $('#zyadArena');
        const waveNumEl = $('#zyadWaveNum');
        const recruitBtn = $('#zyadRecruit');
        const pauseBtn = $('#zyadPause');
        const resultEl = $('#zyadResult');
        const resultTitle = $('#zyadResultTitle');
        const resultText = $('#zyadResultText');
        const restartBtn = $('#zyadRestart');

        // ─────────── 波次 ───────────
        function buildWavePlan(wave) {
            const count = 10 + (wave - 1); // 每波敌数（基线）
            const plan = [];
            for (let i = 0; i < count; i++) {
                const r = Math.random();
                let t;
                if (wave < 3) t = '兵';
                else if (wave < 7) t = r < 0.7 ? '兵' : '卒';
                else t = r < 0.4 ? '兵' : r < 0.85 ? '卒' : '将';
                plan.push(t);
            }
            return plan;
        }

        function startNextWave() {
            if (game.wave > game.maxWaves) return;
            game.spawnPlan = buildWavePlan(game.wave);
            game.spawnIndex = 0;
            game.spawnTimer = 0;
            game.waveActive = true;
            waveNumEl.textContent = game.wave;
        }

        function updateWave(dt) {
            if (game.waveActive) {
                if (game.spawnIndex < game.spawnPlan.length) {
                    game.spawnTimer -= dt;
                    if (game.spawnTimer <= 0) {
                        const type = game.spawnPlan[game.spawnIndex];
                        game.leftBF.spawnEnemy(type, game.wave);
                        game.spawnIndex++;
                        game.spawnTimer = 1.25; // 刷怪间隔（基线）
                    }
                } else if (game.leftBF.enemies.length === 0) {
                    game.waveActive = false;
                    game.wave++;
                    game.waveCooldown = 5;
                    if (game.wave > game.maxWaves) {
                        endGame('win', '成功守住所有波次！');
                    }
                }
            } else if (game.recruitStarted && game.waveCooldown > 0) {
                game.waveCooldown -= dt;
                if (game.waveCooldown <= 0) startNextWave();
            }
        }

        // ─────────── 骑（旗枪）挥旗动效组件 ───────────
        // 复用 canvas/qi.html 的逻辑：以旗面左端为轴，逆时针挥砍一圈，
        // 攻击时宽度放大 FLAG_ATTACK_SCALE 倍，末段 progressive 缩回原样。
        const FLAG_ATTACK_SCALE = 4;   // 攻击时宽度扩大倍数
        const FLAG_ATTACK_HEIGHT_SCALE = 2;  // 攻击时高度扩大倍数
        const FLAG_SWING_TURNS = 360;  // 逆时针挥砍一圈

        // 图片只加载一次（缓存）
        const _qiImgCache = { base: null, flag: null, loaded: 0 };
        (function _loadQiImages() {
            const a = new Image(), b = new Image();
            a.onload = () => { _qiImgCache.base = a; _qiImgCache.loaded++; };
            b.onload = () => { _qiImgCache.flag = b; _qiImgCache.loaded++; };
            a.src = 'canvas/qi.png';
            b.src = 'canvas/qi_qiang.png';
        })();

        class QiFlag {
            constructor(size) {
                this.size = size || 160;
                this.canvas = null;
                this.ctx = null;
                this.initialAngle = -10;     // 旗枪初始微抬角度
                this.angle = this.initialAngle;
                this.targetAngle = this.initialAngle;
                this.state = 'IDLE';
                this.widthScale = 1;
                this.heightScale = 1;
                this.shake = 0;
                this.baseW = this.size * 0.28;   // 旗杆显示宽
                this.baseH = this.size * 0.30;   // 旗杆显示高
                this.flagW = this.size * 0.15;   // 旗面基础宽（×4 后仍可容纳）
                this.flagH = this.flagW * 72 / 822 * 8;   // 旗面高度加倍
                this.pivotX = this.size / 2;
                this.pivotY = this.size * 0.36;
            }
            attach(canvas) {
                this.canvas = canvas;
                this.ctx = canvas.getContext('2d');
                _qiFlags.push(this);
                this.render();
                return this;
            }
            swing() {
                if (this.state === 'ATTACK') return;
                this.angle = this.initialAngle;
                this.targetAngle = this.initialAngle - FLAG_SWING_TURNS; // 逆时针一圈
                this.widthScale = FLAG_ATTACK_SCALE;
                this.heightScale = FLAG_ATTACK_HEIGHT_SCALE;
                this.shake = this.size * 0.08;
                this.state = 'ATTACK';
            }
            // 推进挥砍状态（战场每帧调用，与是否挂载 canvas 无关）
            update() {
                if (this.state !== 'ATTACK') return;
                const angleDiff = this.targetAngle - this.angle;
                if (Math.abs(angleDiff) > 1) {
                    this.angle += angleDiff * 0.25;
                    const traveled = Math.abs(this.angle - this.initialAngle);
                    const progress = Math.min(traveled / FLAG_SWING_TURNS, 1);
                    if (progress < 0.6) {
                        this.widthScale = FLAG_ATTACK_SCALE;
                        this.heightScale = FLAG_ATTACK_HEIGHT_SCALE;
                    } else {
                        const t = (progress - 0.6) / 0.4;
                        const ease = t * t * (3 - 2 * t); // smoothstep
                        this.widthScale = FLAG_ATTACK_SCALE - (FLAG_ATTACK_SCALE - 1) * ease;
                        this.heightScale = FLAG_ATTACK_HEIGHT_SCALE - (FLAG_ATTACK_HEIGHT_SCALE - 1) * ease;
                    }
                } else {
                    this.angle = this.initialAngle;
                    this.widthScale = 1;
                    this.heightScale = 1;
                    this.state = 'IDLE';
                }
            }
            _drawShape(ctx, S) {
                if (!_qiImgCache.base || !_qiImgCache.flag) return;
                let sx = 0, sy = 0;
                if (this.shake > 0.3) {
                    sx = (Math.random() - 0.5) * this.shake;
                    sy = (Math.random() - 0.5) * this.shake;
                    this.shake *= 0.85;
                } else { this.shake = 0; }
                ctx.drawImage(_qiImgCache.base, this.pivotX - this.baseW / 2 + sx, this.pivotY + sy, this.baseW, this.baseH);
                const fw = this.flagW * this.widthScale;
                const fh = this.flagH * this.heightScale;
                ctx.save();
                ctx.translate(this.pivotX + sx, this.pivotY + sy + S * 0.072);
                ctx.rotate(this.angle * Math.PI / 180);
                ctx.drawImage(_qiImgCache.flag, 0, -fh / 2, fw, fh);
                ctx.restore();
            }
            // 战场：在 (cx,cy) 处绘制（cx,cy 为格子中心）
            drawAt(ctx, cx, cy) {
                const S = this.size;
                ctx.save();
                ctx.translate(cx - S / 2, cy - S / 2);
                this._drawShape(ctx, S);
                ctx.restore();
            }
            // 卡牌：自绘到挂载的 canvas
            render() {
                const ctx = this.ctx, S = this.size;
                if (!ctx) return;
                ctx.clearRect(0, 0, S, S);
                if (this.canvas && !this.canvas.isConnected) return;
                this._drawShape(ctx, S);
            }
        }

        // 共享渲染循环：驱动所有旗枪 canvas（自动剔除已脱离 DOM 的实例）
        const _qiFlags = [];
        function _qiRenderLoop() {
            for (let i = _qiFlags.length - 1; i >= 0; i--) {
                const qf = _qiFlags[i];
                if (!qf.canvas.isConnected) { _qiFlags.splice(i, 1); continue; }
                qf.render();
            }
            requestAnimationFrame(_qiRenderLoop);
        }
        requestAnimationFrame(_qiRenderLoop);

        // ─────────── 刀 / 弓 动画（移植 canvas/dao.html 与 gong.html 效果）───────────

        // 刀图片（刀身 dao.png 静止 + 刀柄 daobing.png 旋转挥砍）
        const _daoImgCache = { dao: null, bing: null, loaded: 0 };
        (function _loadDaoImages() {
            const a = new Image(), b = new Image();
            a.onload = () => { _daoImgCache.dao = a; _daoImgCache.loaded++; };
            b.onload = () => { _daoImgCache.bing = b; _daoImgCache.loaded++; };
            a.src = 'canvas/dao.png';
            b.src = 'canvas/daobing.png';
        })();

        class DaoAnim {
            constructor(size) {
                this.size = size || 200;
                this.aim = 0;        // 屏幕朝向角（指向敌人）
                this.angle = 0;
                this.anim = null;    // { elapsed, dur, from, trailFrom, sweep }
            }
            // targetAngle：屏幕坐标中敌人方向（弧度）
            swing(targetAngle) {
                this.aim = (typeof targetAngle === 'number') ? targetAngle : 0;
                if (this.anim) return;
                const MIN_SWING = Math.PI / 2;
                const startAngle = this.aim;
                let sweep = (startAngle >= 0) ? -startAngle : -(startAngle + 2 * Math.PI);
                let from = startAngle;
                if (Math.abs(sweep) < MIN_SWING) {
                    const dir = sweep < 0 ? -1 : 1;
                    sweep = dir * MIN_SWING;
                    from = -sweep;
                }
                this.anim = { elapsed: 0, dur: 400, from, trailFrom: from, sweep };
            }
            update(dt) {
                if (this.anim) {
                    this.anim.elapsed += dt * 1000;
                    if (this.anim.elapsed >= this.anim.dur) this.anim = null;
                }
            }
            _drawShape(ctx, S) {
                if (!_daoImgCache.dao || !_daoImgCache.bing) return;
                const cx = S / 2, cy = S * 0.5;
                ctx.save();
                ctx.translate(cx, cy);
                const dw = S * 0.46, dh = S * 0.5;
                ctx.drawImage(_daoImgCache.dao, -dw / 2 + S * 0.05, -dh * 0.85 + S * 0.20, dw, dh);
                ctx.restore();

                ctx.save();
                ctx.translate(cx, cy);
                let cur = 0;
                let scale = 1;
                if (this.anim) {
                    const p = Math.min(this.anim.elapsed / this.anim.dur, 1);
                    const ease = 1 - Math.pow(1 - p, 3);
                    cur = this.anim.from + this.anim.sweep * ease;
                    scale = 2 - p;
                    ctx.save();
                    ctx.strokeStyle = 'rgba(0, 220, 255, 0.5)';
                    ctx.lineWidth = S * 0.05;
                    ctx.lineCap = 'round';
                    ctx.shadowBlur = S * 0.08;
                    ctx.shadowColor = '#00f0ff';
                    ctx.beginPath();
                    ctx.arc(0, 0, S * 0.3, this.anim.trailFrom, cur, true);
                    ctx.stroke();
                    ctx.restore();
                }
                ctx.rotate(cur);
                const bw = S * 0.2 * scale, bh = S * 0.36 * 1.1 * scale;
                ctx.drawImage(_daoImgCache.bing, -bw + S * 0.04, -S * 0.12, bw, bh);
                ctx.restore();
            }
            // 战场：在 (cx,cy) 处绘制
            drawAt(ctx, cx, cy) {
                const S = this.size;
                ctx.save();
                ctx.translate(cx - S / 2, cy - S / 2);
                this._drawShape(ctx, S);
                ctx.restore();
            }
        }

        // 弓图片（gong.png 休息 / gong2.png 攻击 + jian.png 箭）
        const _gongImgCache = { rest: null, atk: null, jian: null, loaded: 0 };
        (function _loadGongImages() {
            const a = new Image(), b = new Image(), c = new Image();
            a.onload = () => { _gongImgCache.rest = a; _gongImgCache.loaded++; };
            b.onload = () => { _gongImgCache.atk = b; _gongImgCache.loaded++; };
            c.onload = () => { _gongImgCache.jian = c; _gongImgCache.loaded++; };
            a.src = 'canvas/gong.png';
            b.src = 'canvas/gong2.png';
            c.src = 'canvas/jian.png';
        })();

        // 敌军贴图（canvas/zu.png）
        const _zuImg = new Image();
        let _zuImgLoaded = false;
        const _zuImgOnloads = [];
        _zuImg.onload = () => {
            _zuImgLoaded = true;
            for (const cb of _zuImgOnloads) cb();
        };
        _zuImg.src = 'canvas/zu.png';
        function drawZuTo(cv) {
            if (!_zuImgLoaded) return false;
            const ctx = cv.getContext('2d');
            const S = cv.width;
            ctx.clearRect(0, 0, S, S);
            const iw = _zuImg.naturalWidth || S, ih = _zuImg.naturalHeight || S;
            const s = Math.min(S / iw, S / ih);
            const dw = iw * s, dh = ih * s;
            ctx.drawImage(_zuImg, (S - dw) / 2, (S - dh) / 2, dw, dh);
            return true;
        }

        class GongAnim {
            constructor(size) {
                this.size = size || 200;
                this.aim = 0;
                this.bowScaleX = 1;   // 形变回弹
                this.arrows = [];
                this.hasTarget = false;
            }
            setHasTarget(v) {
                this.hasTarget = !!v;
            }
            shoot(targetAngle) {
                this.aim = (typeof targetAngle === 'number') ? targetAngle : 0;
                this.bowScaleX = -0.6;             // 反向弯曲形变
                this.hasTarget = true;
                const sp = this.size * 0.11;
                this.arrows.push({
                    x: this.size / 2, y: this.size / 2,
                    vx: Math.cos(this.aim) * sp,
                    vy: Math.sin(this.aim) * sp - this.size * 0.02,
                    angle: this.aim
                });
            }
            update(dt) {
                const k = Math.min(1, 0.12 * dt * 60);
                this.bowScaleX += (1 - this.bowScaleX) * k;
                const attacking = Math.abs(this.bowScaleX - 1) > 0.12;
                if (!this.hasTarget && !attacking) {
                    this.aim += (0 - this.aim) * k;
                    if (Math.abs(this.aim) < 0.01) this.aim = 0;
                }
                const G = this.size * 0.004 * 60; // 转每秒（原每帧增量 ×60）
                for (let i = this.arrows.length - 1; i >= 0; i--) {
                    const a = this.arrows[i];
                    a.vy += G * dt; a.x += a.vx * dt * 60; a.y += a.vy * dt * 60;
                    a.angle = Math.atan2(a.vy, a.vx);
                    if (a.x < -this.size || a.x > this.size * 2 || a.y > this.size * 2) this.arrows.splice(i, 1);
                }
            }
            _drawShape(ctx, S) {
                if (!_gongImgCache.rest || !_gongImgCache.atk) return;
                const attacking = Math.abs(this.bowScaleX - 1) > 0.12;
                const showAttackPose = attacking || this.hasTarget;
                ctx.save();
                ctx.translate(S / 2, S / 2);
                ctx.rotate(this.aim);
                ctx.scale(this.bowScaleX, 1);
                const bw = S * 0.22, bh = S * 0.6;
                const img = showAttackPose ? _gongImgCache.atk : _gongImgCache.rest;
                ctx.drawImage(img, -bw / 2, -bh / 2, bw, bh);
                ctx.restore();
                for (const a of this.arrows) {
                    ctx.save();
                    ctx.translate(a.x, a.y);
                    ctx.rotate(a.angle);
                    if (_gongImgCache.jian) {
                        const ah = S * 0.05;
                        ctx.drawImage(_gongImgCache.jian, -S * 0.12, -ah / 2, S * 0.24, ah);
                    } else {
                        ctx.strokeStyle = '#e74c3c'; ctx.lineWidth = 2;
                        ctx.beginPath(); ctx.moveTo(-S * 0.12, 0); ctx.lineTo(S * 0.12, 0); ctx.stroke();
                    }
                    ctx.restore();
                }
            }
            drawAt(ctx, cx, cy) {
                const S = this.size;
                ctx.save();
                ctx.translate(cx - S / 2, cy - S / 2);
                this._drawShape(ctx, S);
                ctx.restore();
            }
        }

        // 刀 / 弓 不再单独跑渲染循环，由战场 drawFrame 中的 drawAt 统一驱动

        // ─────────── 主循环 ───────────
        function loop(t) {
            if (!game.running) return;
            if (!game.paused) {
                const dt = Math.min(0.05, (t - game.lastTime) / 1000 || 0.016);
                game.lastTime = t;

                updateWave(dt);

                for (const e of [...game.leftBF.enemies]) game.leftBF.updateEnemy(e, dt);
                for (const e of [...game.rightBF.enemies]) game.rightBF.updateEnemy(e, dt);
                for (const d of game.leftBF.defenders) game.leftBF.updateDefender(d, dt);
                for (const d of game.rightBF.defenders) game.rightBF.updateDefender(d, dt);
                for (const p of [...game.leftBF.projectiles]) game.leftBF.updateProjectile(p, dt);
                for (const p of [...game.rightBF.projectiles]) game.rightBF.updateProjectile(p, dt);
                game.leftBF.updateEffects(dt);
                game.rightBF.updateEffects(dt);
                game.leftBF.updateSkillFx(dt);
                game.rightBF.updateSkillFx(dt);
                // 整盘 canvas 重绘（含选中士兵信息框 / 最近敌人距离）
                game.leftBF.drawFrame();
                game.rightBF.drawFrame();

                updateGrainDisplay();

                game.aiTimer -= dt;
                if (game.aiTimer <= 0) {
                    game.rightBF.aiAct();
                    game.rightBF.updateAIBar();
                    game.aiTimer = 2;
                }

                if (game.leftBF.odouHP <= 0) {
                    endGame('lose', '你的阿斗被敌军掳走了…');
                }
            } else {
                game.lastTime = t;
            }
            requestAnimationFrame(loop);
        }

        function updateGrainDisplay() {
            const costEl = $('#zyadRecruitCost');
            if (costEl) costEl.textContent = game.leftBF.recruitCost;
            if (recruitBtn) recruitBtn.disabled = game.leftBF.grain < game.leftBF.recruitCost;
            const grainEl = $('#zyadGrain');
            if (grainEl) grainEl.textContent = Math.floor(game.leftBF.grain);
        }

        function endGame(result, text) {
            game.running = false;
            game.result = result;
            resultEl.classList.remove('hidden');
            resultTitle.textContent = result === 'win' ? '胜利！' : result === 'lose' ? '失败' : '平局';
            resultTitle.style.color = result === 'win' ? '#15803d' : result === 'lose' ? '#b91c1c' : '#d97706';
            resultText.textContent = text;
        }

        // ─────────── 指针拖动交互 ───────────
        // 坐标换算：屏幕坐标 → 棋盘格 (r,c) 与画布像素 (bx,by)
        function cellFromEvent(bf, e) {
            const rect = bf.canvas.getBoundingClientRect();
            const bx = (e.clientX - rect.left) / rect.width * BOARD_W;
            const by = (e.clientY - rect.top) / rect.height * BOARD_H;
            const c = Math.max(0, Math.min(COLS - 1, Math.floor(bx / CELL)));
            const r = Math.max(0, Math.min(ROWS - 1, Math.floor(by / CELL)));
            return { r, c, bx, by };
        }

        // 卡牌部署（点击落点）：与原来一致的合并 / 换位 / 清地逻辑
        function placeSelectedCard(bf, r, c) {
            const card = game.selectedCard;
            if (!card) return;
            if (card.type === 'shovel') {
                if (bf.grid[r][c] === TILE.LOCKED) {
                    bf.grid[r][c] = TILE.CLEARED; // 下一帧 drawFrame 自动刷新贴图
                    bf.useCard(card.idx);
                    game.selectedCard = null;
                    bf.renderCards();
                }
                return;
            }
            if (card.type === 'general') {
                const existingDef = bf.getDefenderAt(r, c);
                if (existingDef && existingDef.isFragment) {
                    const combo = comboFor(card.char, existingDef.char);
                    if (combo) {
                        bf.removeDefender(existingDef);
                        formGeneralAt(bf, r, c, combo);
                        bf.useCard(card.idx);
                        game.selectedCard = null;
                        bf.renderCards();
                        bf.showFloat(c, r, combo.name + ' 现！', 'crit');
                    }
                    // 不可合成则无操作（弹回）
                } else if (bf.grid[r][c] === TILE.CLEARED && !existingDef) {
                    bf.placeDefender(r, c, 'general', 1, card.char);
                    bf.useCard(card.idx);
                    game.selectedCard = null;
                    bf.renderCards();
                    tryCombineAround(bf, r, c);
                }
                return;
            }
            const existingDef = bf.getDefenderAt(r, c);
            if (existingDef && existingDef.type === card.type && existingDef.level === card.level && existingDef.level < 5) {
                bf.levelUpDefender(existingDef);
                bf.showFloat(c, r, String(existingDef.level), 'crit');
                bf.useCard(card.idx);
                game.selectedCard = null;
                bf.renderCards();
            } else if (existingDef) {
                // 已占用且不可合并 → 卡牌上场，被挤下的士兵退回卡牌槽（used=false），等效换位
                const displaced = { type: existingDef.type, level: existingDef.level, used: false };
                bf.removeDefender(existingDef);
                bf.placeDefender(r, c, card.type, card.level);
                bf.cards[card.idx] = displaced;
                game.selectedCard = null;
                bf.renderCards();
                bf.showFloat(c, r, '换位', 'crit');
            } else if (bf.grid[r][c] === TILE.CLEARED && !existingDef) {
                bf.placeDefender(r, c, card.type, card.level);
                bf.useCard(card.idx);
                game.selectedCard = null;
                bf.renderCards();
            }
        }

        // 卡牌拖到战场某格是否合法（用于拖拽高亮与落地判定）
            function cardDropValid(bf, card, r, c) {
                if (card.type === 'shovel') return bf.grid[r][c] === TILE.LOCKED;
                if (card.type === 'general') {
                    const existing = bf.getDefenderAt(r, c);
                    if (existing && existing.isFragment) return !!comboFor(card.char, existing.char); // 可叠合成
                    return bf.grid[r][c] === TILE.CLEARED && !existing; // 仅空开垦地
                }
                const existing = bf.getDefenderAt(r, c);
            if (existing) return true; // 同类同级→升级 / 异型异级→换位
            return bf.grid[r][c] === TILE.CLEARED; // 仅空的开垦地可落
        }

        // 从武将碎片池随机抽一个（抽后即从池中移除，保证不重复超出数量）
        function drawGeneral() {
            const pool = game.generalPool;
            if (!pool || pool.length === 0) return null;
            const i = Math.floor(Math.random() * pool.length);
            return pool.splice(i, 1)[0];
        }

        // 合成武将：在 (r,c) 放置一个已成形武将（按 weapon 类型攻击，等级 3 强度）
        function formGeneralAt(bf, r, c, combo) {
            bf.placeDefender(r, c, combo.weapon, 3);
            const d = bf.getDefenderAt(r, c);
            if (d) {
                d.isGeneral = true;
                d.generalName = combo.name;
                d.skill = combo.skill;
                d.char = null;
                d.skillCd = d.skillCdMax = SKILL_CD[d.skill] || 0;
                d.leapCharges = 0;
            }
            return d;
        }

        // 碎片落位/移动后，仅检测"左右相邻"且严格 左=a、右=b 的合成（上下、右左均不合成）
        function tryCombineAround(bf, r, c) {
            const d = bf.getDefenderAt(r, c);
            if (!d || !d.isFragment) return false;
            // 情形1：当前碎片是左片(a)，右侧是它的右片(b)
            const right = bf.getDefenderAt(r, c + 1);
            if (right && right.isFragment) {
                const combo = comboForExact(d.char, right.char);
                if (combo) {
                    bf.removeDefender(right);
                    bf.removeDefender(d);
                    formGeneralAt(bf, r, c, combo);
                    bf.showFloat(c, r, combo.name + ' 现！', 'crit');
                    return true;
                }
            }
            // 情形2：当前碎片是右片(b)，左侧是它的左片(a)
            const left = bf.getDefenderAt(r, c - 1);
            if (left && left.isFragment) {
                const combo = comboForExact(left.char, d.char);
                if (combo) {
                    bf.removeDefender(d);
                    bf.removeDefender(left);
                    formGeneralAt(bf, r, c - 1, combo);
                    bf.showFloat(c - 1, r, combo.name + ' 现！', 'crit');
                    return true;
                }
            }
            return false;
        }

        // 将指针拖动监听绑定到玩家战场 canvas（initGame 中 render 之后调用）。
        // 每次重开都会新建 canvas，旧 canvas 随容器清空被回收，故不会重复绑定。
        function bindArenaInteractions() {
            const bf = game.leftBF;
            const cv = bf.canvas;
            if (!cv || cv._zyadBound) return;
            cv._zyadBound = true;

            cv.addEventListener('pointerdown', (e) => {
                e.preventDefault();
                const cell = cellFromEvent(bf, e);

                // 卡牌部署模式：点击落点即放置（卡牌不走拖动）
                if (game.selectedCard) {
                    placeSelectedCard(bf, cell.r, cell.c);
                    return;
                }

                const def = bf.getDefenderAt(cell.r, cell.c);
                if (def) {
                    // 可能开始拖动；纯点击时用于切换选中（显示射程圈 + 信息框）
                    bf.drag = {
                        def,
                        fromR: cell.r, fromC: cell.c,
                        x: cell.bx, y: cell.by,
                        startX: cell.bx, startY: cell.by,
                        hoverR: cell.r, hoverC: cell.c,
                        moved: false
                    };
                } else {
                    // 点在空格：清除当前选中
                    game.selectedDefender = null;
                    bf.drag = null;
                }
            });

            cv.addEventListener('pointermove', (e) => {
                const drag = bf.drag;
                if (!drag || !drag.def) return;
                const cell = cellFromEvent(bf, e);
                drag.x = cell.bx;
                drag.y = cell.by;
                drag.hoverR = cell.r;
                drag.hoverC = cell.c;
                if (Math.hypot(cell.bx - drag.startX, cell.by - drag.startY) > 6) drag.moved = true;
            });

            cv.addEventListener('pointerup', (e) => {
                const drag = bf.drag;
                if (!drag || !drag.def) return;
                bf.drag = null;

                if (!drag.moved) {
                    // 纯点击：切换选中，再次点击同一士兵则取消
                    if (game.selectedDefender && game.selectedDefender.defender === drag.def) {
                        game.selectedDefender = null;
                    } else {
                        game.selectedDefender = { defender: drag.def, r: drag.fromR, c: drag.fromC, bf };
                    }
                    return;
                }

                const tr = drag.hoverR, tc = drag.hoverC;
                const def = drag.def;
                if (tr == null || tc == null) return;
                if (tr === def.r && tc === def.c) return; // 落在原格，无操作

                const st = bf.grid[tr][tc];
                const movableTile = (st !== TILE.LOCKED && st !== TILE.ENTRY && st !== TILE.ODOU && st !== TILE.PATH);
                const existing = bf.getDefenderAt(tr, tc);

                if (!existing) {
                    if (movableTile) {
                        def.r = tr; def.c = tc;       // 移动到空格
                        bf.showFloat(tc, tr, '移动', 'crit');
                        tryCombineAround(bf, tr, tc);  // 移动后检测相邻合成
                    }
                    // 非法落点（荒地/敌营/阿斗/道路）→ 自动弹回，无操作
                } else {
                    if (def.isFragment && existing.isFragment) {
                        // 碎片拖到碎片上：可合成则合成，否则弹回
                        const combo = comboFor(def.char, existing.char);
                        if (combo) {
                            bf.removeDefender(existing);
                            bf.removeDefender(def);
                            formGeneralAt(bf, tr, tc, combo);
                            bf.showFloat(tc, tr, combo.name + ' 现！', 'crit');
                        }
                    } else if (existing.type === def.type && existing.level === def.level && existing.level < 5) {
                        bf.mergeDefenders(existing, def); // 同类同级 → 升级
                        bf.showFloat(tc, tr, String(existing.level), 'crit');
                    } else {
                        bf.swapDefenders(def, existing);   // 异型/异级 → 交换
                        bf.showFloat(tc, tr, '换位', 'crit');
                    }
                }
            });

            cv.addEventListener('pointercancel', () => {
                bf.drag = null;
            });
        }

        // 点击战场之外区域取消选中的士兵（卡牌选中仍由卡牌槽自身管理）
        document.addEventListener('pointerdown', (e) => {
            const cv = game.leftBF && game.leftBF.canvas;
            if (cv && (e.target === cv || (game.leftBF.boardEl && game.leftBF.boardEl.contains(e.target)))) return;
            if (game.selectedDefender) game.selectedDefender = null;
        }, true);

        // ─────────── 按钮 ───────────
        recruitBtn?.addEventListener('click', () => {
            if (game.leftBF.recruit()) {
                game.recruitStarted = true;   // 首次征兵后，第一波敌军才开始倒计时
                game.selectedCard = null;
                game.leftBF.renderCards();
                updateGrainDisplay();
            }
        });

        pauseBtn?.addEventListener('click', () => {
            game.paused = !game.paused;
            pauseBtn.textContent = game.paused ? '▶' : '⏸';
        });

        restartBtn?.addEventListener('click', () => initGame());

        // ─────────── 初始化 ───────────
        function initGame() {
            game.leftBF = new Battlefield('left', 0, LEFT_PATH, MY_MAP);
            game.rightBF = new Battlefield('right', 0, RIGHT_PATH, FOE_MAP);
            game.leftBF.buildGrid();
            game.rightBF.buildGrid();

            const leftArena = $('#zyadLeftArena');
            const rightArena = $('#zyadRightArena');
            // 上方显示 AI，下方显示己方
            game.rightBF.render(leftArena);
            game.leftBF.render(rightArena);

            // 战局开始：玩家征兵栏为空，需点击「征兵」获取将士
            game.leftBF.cards = [];
            game.leftBF.renderCards();

            // 武将碎片池：每局重置（抽过的不再出现，超出数量不会再抽）
            game.generalPool = GENERAL_POOL.slice();

            game.rightBF.refillCards();

            game.wave = 1;
            game.waveActive = false;
            game.waveCooldown = 2;
            game.recruitStarted = false;
            game.paused = false;
            game.result = null;
            game.selectedCard = null;
            game.selectedDefender = null;
            game.aiTimer = 1;
            pauseBtn.textContent = '⏸';
            resultEl.classList.add('hidden');
            updateGrainDisplay();
            bindArenaInteractions();
        }

        // ─────────── 缩放适配 ───────────
        function fitZyadGame() {
            const wrap = document.getElementById('zyadWrap');
            const fit = document.getElementById('zyadFit');
            if (!wrap || !fit) return;
            const DW = 432;
            const DH = wrap.scrollHeight;
            if (!DH) return;
            const MAX_W = 2622, MAX_H = 1206;
            const availW = Math.min(window.innerWidth, MAX_W);
            const availH = Math.min(window.innerHeight, MAX_H);
            let scale = Math.min(availW / DW, availH / DH, 2.0);
            if (!isFinite(scale) || scale <= 0) scale = 1;
            wrap.style.transform = 'scale(' + scale + ')';
            fit.style.width = (DW * scale) + 'px';
            fit.style.height = (DH * scale) + 'px';
        }
        window.addEventListener('resize', fitZyadGame);
        window.addEventListener('orientationchange', fitZyadGame);
        window.fitZyadGame = fitZyadGame;

        // ─────────── 启动 ───────────
        initGame();
        game.running = true;
        game.lastTime = performance.now();
        requestAnimationFrame(loop);
        requestAnimationFrame(() => {
            requestAnimationFrame(fitZyadGame);
        });
    })();
    </script>
</body>
</html>
